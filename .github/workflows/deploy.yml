name: Deploy to GitHub Pages

# Auto-deploys to https://7sthunder.github.io/portfolio/ on every push to main.
on:
  push:
    branches: [main]
  # Also allows a manual re-deploy from the Actions tab.
  workflow_dispatch:

# Give the workflow permission to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel superseded ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5